# The test runner's own file (law L7 leaves it unstamped, as it does a cargo manifest).
# A test that measures the host's timer (the draws' and the ramps' counts, a stall's phase) runs
# with the machine to itself: under the whole suite's parallel processes a 20 ms tick landed every
# 31 ms, which is the load's doing, not the code's (docs/maquinar-plan.md, "Traps"; questions Q13).
# fisica's runner counts its steps against the clock the same way (C-114), and so does every test
# the bench's plan lists as timed ("Which of the bench's tests go behind the machine's lock"): an
# adapter's timeout under the whole suite's load fell 10 ms short (2026-11-23).
[[profile.default.overrides]]
filter = 'package(veredas-maquinar) & (test(draws_come_at_their_interval) | test(ramps_come_at_their_interval_counted_apart_from_draws) | test(a_stall_skips_the_draws_and_steps_it_missed) | test(a_draw_or_a_step_is_next_due_an_interval_after_it_was_due) | test(a_reaction_answers_a_write_with_a_timed_sequence) | test(a_stop_is_prompt_whatever_the_interval) | test(the_machine_announces_awaits_the_answer_and_reports_the_outcome_tick_by_tick) | test(a_destination_s_state_forces_the_outcome_and_the_bench_s_knobs_set_it) | test(faults_mark_their_share_of_items_and_the_rate_is_the_interval_s_whatever_the_tick) | test(the_machine_and_the_unit_converse_over_a_real_socket_and_the_knobs_turn_live) | binary(pressure) | test(the_knobs_delay_silence_and_drop_every_connection) | test(a_class_1_connection_produces_at_its_rpi_and_consumes_what_its_originator_runs) | test(a_connection_whose_originator_falls_silent_is_closed_at_its_timeout) | test(the_timeout_counts_the_consumed_rpi_and_the_multiplier_and_the_first_frame_waits_ten_seconds) | test(a_connection_s_first_frame_comes_at_once_whatever_the_others_wait_for) | test(the_runner_steps_in_real_time_and_its_handle_reads_and_moves_the_scene) | test(an_identify_is_answered_within_its_response_delay) | test(lldp_names_the_station_and_the_port_and_says_when_it_leaves) | test(round_1::the_delay_follows_the_factor) | test(round_1::lldp_comes_on_its_interval) | test(round_2::a_multiplier_of_two_is_sixteen_rpis) | test(round_2::the_first_frame_comes_at_once_at_a_long_rpi) | test(round_2::stale_frames_do_not_feed_the_watchdog) | test(round_1::a_stalled_runner_catches_up_and_counts_its_late_steps) | binary(reflexo) | test(round_4::an_answer_to_a_client_that_closed_during_its_delay_is_counted_as_none) | test(round_4::the_same_client_closing_with_a_reset_counts_none_either) | test(round_5::a_client_that_closes_or_resets_during_the_delay_is_gone_at_once_whatever_it_pipelined) | test(round_3::a_multiplier_of_three_is_thirty_two_rpis) | test(round_3::a_restart_closes_a_session_whose_answers_wait_unread) | test(round_2::a_neighbour_silent_past_its_ttl_ages_out) | test(round_3::the_executable_prints_the_status_lines_once_a_second) | test(round_6::two_connections_wait_out_their_delays_together) | test(round_6::a_close_behind_many_pipelined_requests_is_seen_at_once) | test(round_3::no_dcp_frame_is_handed_to_the_interface_after_the_mute_returns))'
threads-required = 'num-cpus'

# Core's fieldbus masters judge time on the wire: a Modbus client's bounds and an EtherNet/IP
# scanner's interval, timeouts and windows, in core's own tests and against the bench in
# `tools/mestres`. Each runs with the machine to itself: under the whole suite's processes the
# exchange came round less often than its interval (2026-11-23), the load's doing, not the code's
# (docs/core-plan.md, "Traps").
[[profile.default.overrides]]
filter = '(package(veredas-core) & (binary(enip_scanner) | binary(modbus_client))) | package(mestres)'
threads-required = 'num-cpus'

# A test that keeps the machine's cores busy for seconds (a slow view read through a dashboard, so
# a stop meets a computation still running: C-049) runs alone too, so its load lands on no other
# test's timing (a dashboard asked between two equal computations, a page waited for).
[[profile.default.overrides]]
filter = 'test(a_stop_waits_for_a_dashboard_still_computed)'
threads-required = 'num-cpus'

# The tests that drive a headless browser run two at a time: on CI's runner (four cores) the whole
# suite's browsers at once left one page unbooted for 20 s and one browser's port unwritten for
# 30 s (CI red on b995622 and 9bca3b1), the load's doing, not the code's.
[test-groups]
browser = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(veredas-supervisao) & (binary(dashboards) | binary(host) | binary(layout) | binary(tables) | binary(writes))'
test-group = 'browser'

# A member's run before a push (`--profile no-browser`): everything but the tests that drive a
# headless browser, which held the machine's lock eight minutes a run. Supervisão runs those
# before its own pushes, and the orchestrating session runs the whole suite on `main`
# (the architect, 2026-11-22; `CLAUDE.md`, "Several sessions at once").
[profile.no-browser]
default-filter = 'not (package(veredas-supervisao) & (binary(dashboards) | binary(host) | binary(layout) | binary(tables) | binary(writes)))'
