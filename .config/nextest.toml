# The test runner's own file (law L7 leaves it unstamped, as it does a cargo manifest).
# A test that measures the host's timer runs with the machine to itself: under the whole
# suite's parallel processes a 20 ms tick landed every 31 ms, which is the load's doing, not
# the code's (docs/maquinar-plan.md, "Traps"; docs/questions.md Q13).
[[profile.default.overrides]]
filter = 'test(draws_come_at_their_interval)'
threads-required = 'num-cpus'
