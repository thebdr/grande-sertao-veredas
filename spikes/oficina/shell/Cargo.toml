[package]
name = "oficina-spike-shell"
version = "0.0.0"
description = "Oficina's own-shell spike: the Qt Quick window, its QML, and the one bridge seam to the Rust model"
edition.workspace = true
publish.workspace = true

[dependencies]
oficina-spike-model = { path = "../model" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[dev-dependencies]
tempfile = "3"
