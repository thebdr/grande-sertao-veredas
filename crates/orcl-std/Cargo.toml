[package]
name = "orcl-std"
# The crate's SemVer: law L3 holds every crate under crates/ to a version from 2.0.0, so the language's
# crates start at 2.0.0-alpha.1. The language has a number of its own beside it, ORCL 1, which the
# library states as `LANGUAGE` (docs/orcl/README.md; docs/questions.md Q220).
version = "2.0.0-alpha.1"
edition.workspace = true
publish = false
description = "The ORCL standard control library: the scan model, IEC-style timers, edges, a counter and bit access (no_std)"

# no_std, no unsafe, no panic path: the lints in src/lib.rs and clippy.toml (ORCL's O13) are the language's
# rules (docs/orcl/language/README.md). It depends on nothing.
[dependencies]

# Its tests read what cargo says of the crate (`cargo metadata`), as core's do: dev-dependencies are free (law L5)
# and never reach the library.
[dev-dependencies]
serde_json = { workspace = true }
