[package]
name = "orcl-runtime"
# ORCL's own SemVer, as orcl-std's (docs/orcl/README.md).
version = "2.0.0-alpha.1"
edition.workspace = true
publish = false
description = "The engine of an ORCL scan: a cyclic task over a process image, its watchdog, safe outputs and cycle statistics"

# No operating-system code: the real-time setup of a Linux process is the host's (docs/orcl/README.md,
# "Rules"). It uses orcl-std, and orcl-interp for the programs it runs interpreted (law L5: orcl-* use each other
# and core).
[dependencies]
orcl-std = { path = "../orcl-std" }
orcl-interp = { path = "../orcl-interp" }
