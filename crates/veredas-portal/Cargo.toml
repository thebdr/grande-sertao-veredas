[package]
name = "veredas-portal"
# Its own SemVer (law L3), starting at core's current MAJOR (the plan, "Versioning").
version = "2.0.0-alpha.1"
edition.workspace = true
publish = false
# The architect, 2026-11-25 (docs/questions.md Q35): every crate but Oficina states this expression
# and carries the two texts beside its manifest, the copyright holder thebdr.
license = "MIT OR Apache-2.0"
description = "The gateway of Veredas 2: the one point where the suite reads the plant's logs, telegrams and OPC UA servers, stores their data alike and serves it, writes gated"

[features]
default = ["store", "serve", "peer"]
# The session store, DuckDB embedded. Off, the crate is the light build: the data plane, the
# channels, the OPC sources and the project file, nothing persisted (no consumer named today;
# controlador embeds the full build, P-019).
store = ["dep:duckdb", "dep:serde_json", "dep:tokio"]
# The server over a session: the live stream, windowed REST, the gated write surface. Needs the
# store it serves.
serve = ["store", "dep:axum", "dep:tokio-stream", "dep:http-body-util"]
# Portal to portal, the reading side: another portal's HTTP interface read over a socket (the
# event stream, the snapshot, the windowed reads), HTTP/1.1 spoken over tokio itself. Needs no
# store of its own.
peer = ["dep:tokio", "dep:serde_json"]

# A library first, one executable on top (docs/portal-plan.md, "Rules"; tests/component.rs asks
# cargo what it would build). Depends on core alone (law L5, the map); its tests dev-depend on the
# bench, which plays the plant.

[dependencies]
# The shared types, the worker handle, the telegram layer and the OPC client the gateway builds on.
veredas-core = { path = "../veredas-core" }
# Timestamps parsed from lines and file names are chrono formats the operator types.
chrono = { workspace = true }
# Text decoded from the plant's files: UTF-8, UTF-16 and CP1252, detected lazily.
encoding_rs = { workspace = true }
# Newline splitting over decoded text and raw bytes.
memchr = { workspace = true }
# The filesystem accelerator over the poll loop, for local paths: the watcher off Linux
# (src/tail/watch.rs). Kept on every target: dropped on Linux it moves the features cargo unifies
# for a shared crate, and duckdb's engine builds again in every member's target.
notify = { workspace = true }
# Capture rules and family patterns are regexes.
regex = { workspace = true }
# The project file is TOML, and Veredas 1's folder is written out as one.
toml = { workspace = true }
# Reply rules are configuration, read from plain text.
serde = { workspace = true }
# The store, behind its feature.
duckdb = { workspace = true, optional = true }
# Typed row pages are JSON cells (the store).
serde_json = { workspace = true, optional = true }
# A file's identity (volume and index), so a renamed file is still the one being read.
same-file = { workspace = true }
thiserror = { workspace = true }
# The secrets file beside a project: its values sealed with ChaCha20-Poly1305, base64 on disk, the key and the nonces from the system's randomness (Q15).
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }

# The session broadcasts its data frames on a tokio channel, which the server streams; the
# executable takes SIGTERM and SIGINT as its stop (src/main.rs).
tokio = { workspace = true, optional = true, features = ["signal"] }
# The server is axum over tokio; the live stream wraps the frames broadcast as a stream.
axum = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
# The write surface reads its body itself, after the switch, under its own limit; the limit's error type is http-body-util's.
http-body-util = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The watcher on Linux is inotify's, asked for a folder's names and a file's writes alone, so a
# busy neighbour makes no event (src/tail/watch.rs).
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Whether a drive letter is a network drive, so a share is polled and never watched.
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Foundation"] }


[[bin]]
name = "veredas-portal"
path = "src/main.rs"
# The executable runs a session and serves it; the light build has neither, and no executable.
required-features = ["serve"]

[dev-dependencies]
# The bench plays the plant: its emitters write the files the tail follows.
veredas-maquinar = { path = "../veredas-maquinar" }
# cargo metadata's output (tests/component.rs).
serde_json = { workspace = true }
# The OPC UA wire types a test writes and reads (tests/opc.rs), and the runtime its handle needs.
async-opcua-types = { workspace = true }
tokio = { workspace = true }
# Configurations read from TOML in the tests.
# Scratch directories, removed when a test ends.
tempfile = { workspace = true }

# The tests bound to the store and the server declare it, so the light build's test set
# (`cargo test --no-default-features`) compiles and runs the data plane's tests alone.
[[test]]
name = "store"
required-features = ["store"]

[[test]]
name = "session"
required-features = ["store"]

[[test]]
name = "project"
required-features = ["store"]

[[test]]
name = "serve"
required-features = ["serve"]

[[test]]
name = "peer"
required-features = ["peer", "serve"]

[[test]]
name = "store_engine"
required-features = ["store"]

[[test]]
name = "store_window"
required-features = ["store", "serve"]

[[test]]
name = "store_record"
required-features = ["store", "serve"]

[[test]]
name = "controller_state"
required-features = ["store"]

[[test]]
name = "fault_copy"
required-features = ["store", "serve"]
