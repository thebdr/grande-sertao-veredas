[package]
name = "veredas-core"
# Its own SemVer from 2.0.0 (law L3); every component starts at this crate's MAJOR.
version = "2.0.0-alpha.1"
edition.workspace = true
publish = false
# The architect, 2026-11-25 (docs/questions.md Q35): every crate but Oficina states this expression
# and carries the two texts beside its manifest, the copyright holder thebdr.
license = "MIT OR Apache-2.0"
description = "The foundation of Veredas 2: the shared types and content-agnostic protocol layers every component speaks"

# A library, never an executable (docs/core-plan.md, tests/foundation.rs): no [[bin]], no
# [[example]]. Depends on no other member, in any table (law L4).

[features]
# What every component gets unless it asks otherwise: the plant-facing layers and what they stand
# on. Without them (`default-features = false`) core is the header reader every file of the suite
# shares (schema), the PCG32 (rng) and the controller's state text (state), on serde, toml and
# thiserror alone, for a component that reads the suite's files and never a plant
# (docs/core-plan.md, "Features").
default = ["net"]
# The value model and its samples (types: chrono), the worker plumbing (source: regex), the TCP
# telegram layer (telegram: tokio, socket2, regex) and the OPC UA client layer (opc).
net = [
    "dep:async-opcua-client",
    "dep:async-opcua-types",
    "dep:chrono",
    "dep:regex",
    "dep:socket2",
    "dep:tokio",
]
# The OPC UA server (opc::server): a component serving its values (controlador's embedded portal,
# the bench's plant server), off by default so a component that only polls carries the client half
# alone (docs/core-plan.md, "The OPC UA server").
opc-server = ["net", "dep:async-opcua-server"]
# The in-process OPC UA demo plant (opc::demo): test-fixture plumbing, on the server's crates. Core's
# own tests switch it on through the self dev-dependency below (dev-dependencies resolve apart from
# the library's own: not a cycle).
demo-server = ["opc-server"]
# The Modbus/TCP client (fieldbus::modbus): a function that drives hardware, off by default so a
# component that only polls carries no fieldbus code; the controller switches it on, and so do the
# crates that test it (docs/core-plan.md, "The fieldbus masters").
modbus = ["dep:tokio-modbus", "dep:tokio"]
# The EtherNet/IP scanner (fieldbus::enip), off by default for the same reason.
enip = ["dep:ethernetip-core", "dep:ethernetip-connections", "dep:tokio"]

[dependencies]
# The OPC UA client layer (opc): the client, its types, and the server behind demo-server.
async-opcua-client = { workspace = true, optional = true }
async-opcua-server = { workspace = true, optional = true }
async-opcua-types = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
# SourceError's pattern variant; the capture rules' patterns.
regex = { workspace = true, optional = true }
# Capture specs and the byte order are configuration, read from plain text.
serde = { workspace = true }
thiserror = { workspace = true }
# Writes go to the socket itself, so the OS (not a readiness cache) says when it is full.
socket2 = { workspace = true, optional = true }
# Channel files are TOML (docs/channel-schema.md).
toml = { workspace = true }
# The telegram channel runs on its own current-thread runtime, and so do the fieldbus masters.
tokio = { workspace = true, optional = true }
# The Modbus/TCP client's framing (fieldbus::modbus, feature "modbus"): the standard's frames,
# checked here.
tokio-modbus = { workspace = true, optional = true }
# The EtherNet/IP scanner's codecs (fieldbus::enip, feature "enip"): encapsulation, CPF, the
# Connection Manager's requests, Class 1 framing; the scanner itself is core's (docs/questions.md
# Q102).
ethernetip-connections = { workspace = true, optional = true }
ethernetip-core = { workspace = true, optional = true }

[dev-dependencies]
# Switches the demo plant and the fieldbus masters on for core's own tests (law L4 allows core
# itself).
veredas-core = { path = ".", features = ["demo-server", "modbus", "enip"] }
# tests/opc_capabilities.rs drives the stack directly, to pin what the opc layer assumes of it.
async-opcua-client = { workspace = true }
async-opcua-types = { workspace = true }
# cargo metadata's output (tests/foundation.rs).
serde_json = { workspace = true }
# The Rust lexer, for tests/features.rs's audit of core's own sources read as tokens (C-073): a
# raw identifier read as its name, comments gone, every literal whole, each token's line known.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# A string in an attribute, unescaped as serde's and thiserror's derives unescape it (syn 3), so
# the audit reads the code a derive may make of it (`deserialize_with = "path"`, C-073).
syn = { workspace = true }
