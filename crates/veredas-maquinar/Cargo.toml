[package]
name = "veredas-maquinar"
# Its own SemVer (law L3), starting at core's current MAJOR (the plan, "Versioning").
version = "2.0.0-alpha.1"
edition.workspace = true
publish = false
description = "The bench of Veredas 2: simulated hardware on the real wire, by configuration, so every consumer meets its plant before the plant"

# A library first, one executable on top (docs/maquinar-plan.md, "Rules"; tests/component.rs asks
# cargo what it would build). Depends on core alone until aranha exists (law L5, the map).

[dependencies]
# The shared types, the deterministic PCG32, the telegram layer (channel, framing, catalog,
# compose) and the OPC demo plumbing (its relay) the bench builds on.
veredas-core = { path = "../veredas-core", features = ["demo-server"] }
# The OPC UA server the bench serves, and its types.
async-opcua-server = { workspace = true }
async-opcua-types = { workspace = true }
# Timestamps in log lines and file names are chrono formats the operator types.
chrono = { workspace = true }
# Every bench file is TOML, read by serde.
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# The server and the channels run on their own runtimes.
tokio = { workspace = true }

[dev-dependencies]
# The OPC server is driven by the same client library portal will use.
async-opcua-client = { workspace = true }
# cargo metadata's output (tests/component.rs).
serde_json = { workspace = true }
