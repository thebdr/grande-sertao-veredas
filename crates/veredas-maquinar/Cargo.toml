[package]
name = "veredas-maquinar"
# Its own SemVer (law L3), starting at core's current MAJOR (the plan, "Versioning").
version = "2.0.0-alpha.1"
edition.workspace = true
publish = false
description = "The bench of Veredas 2: simulated hardware on the real wire, by configuration, so every consumer meets its plant before the plant"

# A library first, one executable on top (docs/maquinar-plan.md, "Rules"; tests/component.rs asks
# cargo what it would build). Depends on core alone until aranha exists (law L5, the map).

[dependencies]
# The shared types, the deterministic PCG32, the telegram layer (channel, framing, catalog,
# compose) and the OPC demo plumbing (its relay) the bench builds on.
veredas-core = { path = "../veredas-core", features = ["demo-server"] }
# The PROFINET device speaks through the scanner's codecs and raw link, so the two cannot drift
# apart on the wire (docs/questions.md Q5; the map's row from maquinar to aranha).
veredas-aranha = { path = "../veredas-aranha" }
# The OPC UA server the bench serves, and its types.
async-opcua-server = { workspace = true }
async-opcua-types = { workspace = true }
# Timestamps in log lines and file names are chrono formats the operator types.
chrono = { workspace = true }
# The controller's decision rules match a field against a pattern.
regex = { workspace = true }
# The Modbus server takes the connections waiting in its listen queue straight from the socket
# when it drops every connection (modbus.rs).
socket2 = { workspace = true }
# Every bench file is TOML, read by serde.
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# The server and the channels run on their own runtimes; the executable takes SIGTERM and SIGINT as
# its stop (src/main.rs).
tokio = { workspace = true, features = ["signal"] }
# fisica's bodies, contacts and sensors (docs/questions.md Q160); named only in src/fisica/world.rs.
rapier3d-f64 = { workspace = true }

[dev-dependencies]
# The OPC server is driven by the same client library portal will use.
async-opcua-client = { workspace = true }
# cargo metadata's output (tests/component.rs).
serde_json = { workspace = true }
# The Modbus server is driven by a client the bench did not write (tests/modbus_server.rs).
tokio-modbus = { workspace = true }
# The EtherNet/IP adapter is driven by codecs the bench did not write (tests/ethernetip_adapter.rs).
ethernetip-connections = { workspace = true }
ethernetip-core = { workspace = true }
bytes = { workspace = true }
# The emulated EtherCAT segment is brought up by the MainDevice core's master stands on
# (tests/ethercat_segment.rs).
ethercrab = { workspace = true }
futures-lite = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The kernel's own stamp of a frame as it is sent (tests/profinet_device.rs, the strict mute).
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The bench holds the host's timer at a millisecond while it runs (timer.rs, Q13).
windows-sys = { version = "0.59", features = ["Win32_Media", "Win32_System_Threading", "Win32_Foundation"] }
