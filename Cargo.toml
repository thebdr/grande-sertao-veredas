[workspace]
resolver = "3"
members = [
    # Repo tooling, not a component: the suite's laws as cargo tests (the rules of
    # docs/veredas-plan.md that a machine can check; .zen/contract.md C-001..C-006).
    # Exempt from the component laws; runs under `cargo test --workspace`.
    "tools/leis",
    # The foundation (docs/core-plan.md): the shared types and protocol layers more than one
    # component needs, depending on no other member (law L4).
    "crates/veredas-core",
    # The bench (docs/maquinar-plan.md): simulated hardware on the real wire, by configuration,
    # built before the consumer that needs it; a test tool that owns its sockets (law L5: core only).
    "crates/veredas-maquinar",
    # The gateway (docs/portal-plan.md): the one point where the suite reads the plant's logs,
    # telegrams and OPC UA servers, stores their data alike and serves it, writes gated; depends on
    # core alone (law L5), its tests on the bench.
    "crates/veredas-portal",
]

# No [workspace.package] version: each component owns its SemVer from 2.0.0 (the plan,
# "Versioning"; law L3). The edition is shared because it is a language level, not a release.
[workspace.package]
edition = "2024"

# One version of each external crate across the suite; a member writes `x = { workspace = true }`
# and justifies a new line here in its commit message.
[workspace.dependencies]
# The OPC UA stack, pinned exactly: core's tests/opc_capabilities.rs pins what the opc layer assumes
# of it, and runs first after a bump (docs/core-plan.md).
async-opcua-client = "=0.19.0"
async-opcua-server = "=0.19.0"
async-opcua-types = "=0.19.0"
chrono = "0.4"
# The session store (portal): the embedded engine, pinned exactly so the file format and the SQL
# behave the same on every machine; the bundled build compiles the engine once per target dir.
duckdb = { version = "=1.10504.0", features = ["bundled"] }
# The data plane's text decoding (portal): UTF-8, UTF-16 and CP1252, decoded incrementally.
encoding_rs = "0.8"
# Newline splitting over bytes (portal's tail).
memchr = "2"
# The filesystem watcher that wakes a tail's poll loop early on a local path (portal).
notify = "8"
regex = "1"
# A file's identity (volume and index), so a renamed file is still the one being read (portal).
same-file = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
# Scratch directories for tests, removed when the test ends.
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
toml = "1"
# The server (portal): SSE and windowed REST over the session.
axum = "0.8"
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
# Whether a drive letter is a network drive (portal's tail polls a share and never watches it).
windows-sys = "0.59"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# The bundled engine's debug static library is about 2.2 GB and is mapped into every test binary
# that links it, which exhausts the page file when the test fleet links in parallel; the engine
# is compiled optimised and without debug info even in dev (about 600 MB), and nothing of the
# suite's own code changes profile (docs/portal-plan.md, "Traps").
[profile.dev.package.libduckdb-sys]
opt-level = 2
debug = false
