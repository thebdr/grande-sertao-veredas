[workspace]
resolver = "3"
members = [
    # Repo tooling, not a component: the suite's laws as cargo tests (the rules of
    # docs/veredas-plan.md that a machine can check; .zen/contract.md C-001..C-006).
    # Exempt from the component laws; runs under `cargo test --workspace`.
    "tools/leis",
    # Repo tooling, not a component: what the suite ships, the release manifest and its cut, and the
    # tester machine (docs/entrega-plan.md). Exempt from the component laws.
    "tools/entrega",
    # Repo tooling, not a component, test-only: core's fieldbus masters met against the bench's
    # devices, which law L4 keeps out of core's own tests (docs/questions.md Q101). Exempt from the
    # component laws.
    "tools/mestres",
    # Repo tooling, not a component: Ábaco's oracle, the engine measured against the values Excel
    # cached in workbooks it saved (docs/abaco-plan.md, "The oracle and parity"). Exempt from the
    # component laws.
    "tools/abaco-oracle",
    # The foundation (docs/core-plan.md): the shared types and protocol layers more than one
    # component needs, depending on no other member (law L4).
    "crates/veredas-core",
    # The bench (docs/maquinar-plan.md): simulated hardware on the real wire, by configuration,
    # built before the consumer that needs it; a test tool that owns its sockets (law L5: core only).
    "crates/veredas-maquinar",
    # The gateway (docs/portal-plan.md): the one point where the suite reads the plant's logs,
    # telegrams and OPC UA servers, stores their data alike and serves it, writes gated; depends on
    # core alone (law L5), its tests on the bench.
    "crates/veredas-portal",
    # The web interface (docs/supervisao-plan.md): starts the plants' portal sessions in its own
    # process and shows them through one set of object IDs, every write portal's own (law L5: core
    # and portal).
    "crates/veredas-supervisao",
    # The language's crates (docs/orcl/README.md, one plan for all of them): ORCL, control logic in a
    # translatable subset of real Rust, versioned apart from the components. The standard control library,
    # no_std, depending on nothing.
    "crates/orcl-std",
    # The engine of an ORCL scan: a cyclic task over a process image, its watchdog and safe outputs, with no
    # operating-system code; uses orcl-std alone (law L5: orcl-* use each other and core).
    "crates/orcl-runtime",
    # The soft PLC (docs/controlador-plan.md): an ORCL program in a deterministic scan, its states, faults and the
    # commands that move them; uses core's state text and the language's crates (law L5: controlador may use
    # portal, aranha and the orcl-* crates besides core).
    "crates/veredas-controlador",
    # The network scanner (docs/aranha-plan.md): who is on an industrial Ethernet segment and who is
    # cabled to whom, with provenance; a test tool that owns its sockets (law L5: core only). Its
    # PROFINET codecs serve the bench's device meanwhile and move into core (P-018).
    "crates/veredas-aranha",
    # The testing platform (docs/comissionador-plan.md): a plant's acceptance tests, one plain-text
    # file each, run through portal live or replayed, every run ending in its report (law L5: core
    # and portal).
    "crates/veredas-comissionador",
    # The engineering spreadsheet (docs/abaco-plan.md): workbooks computed and edited with no Office on
    # the machine, on its fork of IronCalc (forks/ironcalc, excluded below); depends on no member yet
    # (law L5 allows core and portal).
    "crates/veredas-abaco",
]
# Not the suite's crates: Ábaco's copy of IronCalc (the engine and its file layer), a cargo workspace
# of its own for upstream's tests, reached by veredas-abaco by path (docs/abaco-plan.md, "The fork";
# docs/questions.md Q340). Law L1 lets an excluded crate out only if it is no veredas-* or orcl-*
# crate; it sits outside every member's folder, since cargo makes a crate beneath a member's folder a
# member whatever this list says.
exclude = [
    "forks/ironcalc",
]

# No [workspace.package] version: each component owns its SemVer from 2.0.0 (the plan,
# "Versioning"; law L3). The edition is shared because it is a language level, not a release.
[workspace.package]
edition = "2024"

# One version of each external crate across the suite; a member writes `x = { workspace = true }`
# and justifies a new line here in its commit message.
[workspace.dependencies]
# The OPC UA stack, pinned exactly: core's tests/opc_capabilities.rs pins what the opc layer assumes
# of it, and runs first after a bump (docs/core-plan.md).
async-opcua-client = "=0.19.0"
async-opcua-server = "=0.19.0"
async-opcua-types = "=0.19.0"
chrono = "0.4"
# The session store (portal): the embedded engine, pinned exactly so the file format and the SQL
# behave the same on every machine; the bundled build compiles the engine once per target dir.
duckdb = { version = "=1.10504.0", features = ["bundled"] }
# The data plane's text decoding (portal): UTF-8, UTF-16 and CP1252, decoded incrementally.
encoding_rs = "0.8"
# Newline splitting over bytes (portal's tail).
memchr = "2"
# The filesystem watcher that wakes a tail's poll loop early on a local path (portal).
notify = "8"
regex = "1"
# A file's identity (volume and index), so a renamed file is still the one being read (portal).
same-file = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
# The system's C interface (aranha's raw link and the private network a test makes: AF_PACKET,
# unshare); already in the lock as a dependency of tokio and the rest.
libc = "0.2"
serde_json = "1"
serde_ignored = "0.1"
# Hashes (entrega): a bundle's SHA256SUMS, an OVA's manifest, the base image's pinned SHA-512.
sha2 = "0.10"
socket2 = "0.6"
# Scratch directories for tests, removed when the test ends.
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
toml = "1"
# The server (portal): SSE and windowed REST over the session.
axum = "0.8"
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
# A Modbus/TCP client: core's (fieldbus::modbus) frames its requests with it, and maquinar's tests
# read and write the bench's Modbus server with it, an implementation the bench did not write.
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
# EtherNet/IP codecs the bench did not write (maquinar's tests): the Forward_Open and its reply, the
# Class 1 frame, the encapsulation header and the common packet format, each an implementation of
# its own reading and writing the bench's adapter. Pinned: a young crate (0.1).
ethernetip-connections = "=0.1.1"
ethernetip-core = "=0.1.1"
# Byte buffers, as the EtherNet/IP codecs take them (maquinar's tests).
bytes = "1"
# An EtherCAT MainDevice (maquinar's tests): the crate core's EtherCAT master stands on
# (docs/controlador-plan.md, "Networks and devices"), bringing the bench's emulated segment up.
# Pinned: before 1.0. Its std raw socket and nothing else.
ethercrab = { version = "=0.7.1", default-features = false, features = ["std"] }
# The executor ethercrab's examples drive it with.
futures-lite = "2"
# fisica's physics engine (docs/questions.md Q160, taken meanwhile): one version, the same run on
# every machine.
rapier3d = { version = "=0.36.1", features = ["enhanced-determinism"] }
# Whether a drive letter is a network drive (portal's tail polls a share and never watches it).
windows-sys = "0.59"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# The SVG layout read as XML (supervisao): its element ids and the geometry a marker follows.
roxmltree = "0.20"
# The Rust lexer, for supervisão's test that reads its own sources as tokens (tests/writes.rs):
# a raw identifier read as its name, comments gone, so no spelling hides a path from the reading.
proc-macro2 = "1"
# Ábaco's oracle: an independent reader of a workbook's cached values, to cross-check its own
# reading of the sheet XML (the version Veredas 1's oracle used), and the zip both read through
# (the major the engine's file layer uses).
calamine = "0.26"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Unicode's own decomposition (NFKD), for supervisão's test that reads every file for names
# (tests/component.rs): an accented letter read as its base letter, whatever its block.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# Unicode's general categories and default-ignorable code points, for aranha's reader of the same
# kind (crates/veredas-aranha/tests/component.rs): marks and invisible letters dropped.
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
# HTML's named character references as WHATWG lists them, for the same test: every name of a
# letter read as that letter, the legacy names a browser reads without their `;` among them.
entities = "1"

# The bundled engine's debug static library is about 2.2 GB and is mapped into every test binary
# that links it, which exhausts the page file when the test fleet links in parallel; the engine
# is compiled optimised and without debug info even in dev (about 600 MB), and nothing of the
# suite's own code changes profile (docs/portal-plan.md, "Traps").
[profile.dev.package.libduckdb-sys]
opt-level = 2
debug = false

# The heaviest libraries of a test binary's debug file build with line tables only in dev: OPC
# UA's generated types and Arrow (behind the duckdb wrapper). A backtrace still names file and
# line; the suite's own crates keep full debug info. Named one by one, never `package."*"`: that
# would also reach serde, serde_json, reqwest and tokio, which libduckdb-sys's build script shares
# with the runtime, so every target would rebuild the engine for nothing.
[profile.dev.package.async-opcua-client]
debug = "line-tables-only"
[profile.dev.package.async-opcua-core]
debug = "line-tables-only"
[profile.dev.package.async-opcua-core-namespace]
debug = "line-tables-only"
[profile.dev.package.async-opcua-crypto]
debug = "line-tables-only"
[profile.dev.package.async-opcua-nodes]
debug = "line-tables-only"
[profile.dev.package.async-opcua-server]
debug = "line-tables-only"
[profile.dev.package.async-opcua-types]
debug = "line-tables-only"
[profile.dev.package.arrow]
debug = "line-tables-only"
[profile.dev.package.arrow-arith]
debug = "line-tables-only"
[profile.dev.package.arrow-array]
debug = "line-tables-only"
[profile.dev.package.arrow-buffer]
debug = "line-tables-only"
[profile.dev.package.arrow-cast]
debug = "line-tables-only"
[profile.dev.package.arrow-data]
debug = "line-tables-only"
[profile.dev.package.arrow-ord]
debug = "line-tables-only"
[profile.dev.package.arrow-row]
debug = "line-tables-only"
[profile.dev.package.arrow-schema]
debug = "line-tables-only"
[profile.dev.package.arrow-select]
debug = "line-tables-only"
[profile.dev.package.arrow-string]
debug = "line-tables-only"
[profile.dev.package.duckdb]
debug = "line-tables-only"
